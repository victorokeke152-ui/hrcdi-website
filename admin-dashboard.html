<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRCDI — Governance & Staff Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- HEADER -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-5">
            <div>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-user-shield text-emerald-400"></i> HRCDI Governance Dashboard
                </h1>
                <p class="text-xs text-slate-400">Executive Trustee Staff Appointment & Access Control</p>
            </div>
            <button onclick="loadStaffDirectory()" class="bg-slate-800 hover:bg-slate-700 text-xs px-4 py-2 rounded-xl transition-colors">
                <i class="fa-solid fa-rotate-right mr-1"></i> Refresh List
            </button>
        </div>

        <!-- FORM: APPOINT NEW STAFF -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <h2 class="text-sm font-bold text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Authorize & Appoint Staff Member
            </h2>
            <form id="appoint-form" onsubmit="appointStaff(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Full Name</label>
                    <input type="text" id="staff-name" required placeholder="e.g. John Doe" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">11-Digit National Identification Number (NIN)</label>
                    <input type="text" id="staff-nin-input" maxlength="11" required placeholder="12345678901" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Assigned Role</label>
                    <select id="staff-role" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-xs">
                        <optgroup label="Executive & Governance" class="bg-slate-900 text-emerald-400">
                            <option value="Board of Trustees (BoT)">Board of Trustees (BoT)</option>
                            <option value="Executive Director">Executive Director</option>
                            <option value="Deputy Executive Director">Deputy Executive Director</option>
                        </optgroup>
                        <optgroup label="Management & Coordination" class="bg-slate-900 text-emerald-400">
                            <option value="Programme Manager">Programme Manager</option>
                            <option value="Project Manager">Project Manager</option>
                            <option value="Project Coordinator">Project Coordinator</option>
                        </optgroup>
                        <optgroup label="Field Operations" class="bg-slate-900 text-emerald-400">
                            <option value="Project Officer">Project Officer</option>
                            <option value="Field Officer">Field Officer</option>
                            <option value="Community Mobilizer">Community Mobilizer</option>
                            <option value="Volunteers">Volunteers</option>
                        </optgroup>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Phone Number</label>
                    <input type="text" id="staff-phone" required placeholder="+234..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Appointed By (Trustee Name)</label>
                    <input type="text" id="appointed-by" required placeholder="e.g. Victor Okeke" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white">
                </div>
                <div class="flex items-end">
                    <button type="submit" id="submit-appoint-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold text-white py-3 rounded-xl transition-colors">
                        Register & Activate Staff Profile
                    </button>
                </div>
            </form>
        </div>

        <!-- STAFF DIRECTORY TABLE -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            <h2 class="text-sm font-bold text-slate-200">Active Directory & Access Protocol</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-[10px]">
                        <tr>
                            <th class="p-3">Staff Name</th>
                            <th class="p-3">NIN</th>
                            <th class="p-3">Role</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="staff-table-body" class="divide-y divide-slate-800">
                        <tr><td colspan="5" class="p-4 text-center text-slate-500">Loading directory...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://hrcdi.org.ng';

        document.addEventListener('DOMContentLoaded', loadStaffDirectory);

        function loadStaffDirectory() {
            fetch(`${API_BASE}/manage-staff.php?action=list`)
                .then(res => res.json())
                .then(res => {
                    const tbody = document.getElementById('staff-table-body');
                    tbody.innerHTML = '';

                    if (res.status === 'success' && res.data.length > 0) {
                        res.data.forEach(staff => {
                            let statusBadge = '';
                            if (staff.access_status === 'Active') {
                                statusBadge = `<span class="bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-1 rounded-md text-[10px]">Active</span>`;
                            } else if (staff.access_status === 'Official Meeting Scheduled') {
                                statusBadge = `<span class="bg-amber-950 text-amber-300 border border-amber-800 px-2 py-1 rounded-md text-[10px]">Meeting Required</span>`;
                            } else {
                                statusBadge = `<span class="bg-red-950 text-red-400 border border-red-800 px-2 py-1 rounded-md text-[10px]">Revoked</span>`;
                            }

                            tbody.innerHTML += `
                                <tr class="hover:bg-slate-950/50">
                                    <td class="p-3 font-semibold text-white">${staff.full_name}</td>
                                    <td class="p-3 font-mono">${staff.nin}</td>
                                    <td class="p-3">${staff.role}</td>
                                    <td class="p-3">${statusBadge}</td>
                                    <td class="p-3 space-x-2">
                                        <button onclick="updateStatus(${staff.id}, 'Official Meeting Scheduled')" class="bg-amber-900/40 hover:bg-amber-900 text-amber-300 px-2 py-1 rounded text-[10px]">Schedule Meeting</button>
                                        <button onclick="updateStatus(${staff.id}, 'Revoked')" class="bg-red-900/40 hover:bg-red-900 text-red-300 px-2 py-1 rounded text-[10px]">Revoke Access</button>
                                        <button onclick="updateStatus(${staff.id}, 'Active')" class="bg-emerald-900/40 hover:bg-emerald-900 text-emerald-300 px-2 py-1 rounded text-[10px]">Reactivate</button>
                                    </td>
                                </tr>
                            `;
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No staff members appointed yet.</td></tr>`;
                    }
                });
        }

        function appointStaff(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-appoint-btn');
            btn.disabled = true;

            const formData = new FormData();
            formData.append('action', 'appoint');
            formData.append('full_name', document.getElementById('staff-name').value);
            formData.append('nin', document.getElementById('staff-nin-input').value);
            formData.append('role', document.getElementById('staff-role').value);
            formData.append('phone', document.getElementById('staff-phone').value);
            formData.append('appointed_by', document.getElementById('appointed-by').value);

            fetch(`${API_BASE}/manage-staff.php`, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(res => {
                    btn.disabled = false;
                    alert(res.message);
                    if (res.status === 'success') {
                        document.getElementById('appoint-form').reset();
                        loadStaffDirectory();
                    }
                });
        }

        function updateStatus(staffId, status) {
            let reason = '';
            if (status === 'Revoked' || status === 'Official Meeting Scheduled') {
                reason = prompt(`Enter reason or notes for setting status to "${status}":`);
                if (reason === null) return;
            }

            const formData = new FormData();
            formData.append('action', 'update_status');
            formData.append('staff_id', staffId);
            formData.append('access_status', status);
            formData.append('revocation_reason', reason);

            fetch(`${API_BASE}/manage-staff.php`, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(res => {
                    alert(res.message);
                    loadStaffDirectory();
                });
        }
    </script>
</body>
</html>
