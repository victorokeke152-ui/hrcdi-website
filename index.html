<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRCDI Multi-Staff ID Card Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
        .id-card-wrapper {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
        }
        .id-card {
            width: 320px;
            height: 500px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sharp-logo {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        @media print {
            body {
                background: white;
            }
            .no-print {
                display: none !important;
            }
            .id-card-wrapper {
                background: transparent;
                border: none;
                padding: 0;
                margin: 0;
                page-break-inside: avoid;
            }
            .id-card {
                box-shadow: none;
                border: 1px solid #cbd5e1;
                margin: 10px auto;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="p-4 sm:p-8 flex flex-col items-center min-h-screen">

    <!-- CONTROL PANEL (NO PRINT) -->
    <div class="max-w-xl w-full mb-8 no-print text-white bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-xl flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
            <h2 class="font-bold text-base text-emerald-400">HRCDI Batch ID Generator</h2>
            <p class="text-xs text-slate-400 mt-0.5">Specify how many staff members you need to generate cards for:</p>
        </div>
        <div class="flex items-center gap-2">
            <input type="number" id="staff-count" min="1" max="20" value="1" class="w-16 px-3 py-2 bg-slate-900 border border-slate-600 rounded-xl text-white font-bold text-center text-sm focus:outline-none focus:border-emerald-500">
            <button onclick="generateCards()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition shadow flex items-center gap-1.5 whitespace-nowrap">
                <i class="fa-solid fa-users-gear"></i> Generate Cards
            </button>
            <button onclick="window.print()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs rounded-xl transition shadow flex items-center gap-1.5 whitespace-nowrap">
                <i class="fa-solid fa-print"></i> Print All
            </button>
        </div>
    </div>

    <!-- DYNAMIC CARDS CONTAINER -->
    <div id="cards-container" class="w-full max-w-6xl space-y-8">
        <!-- Cards will be generated here automatically -->
    </div>

    <!-- JAVASCRIPT FOR DYNAMIC GENERATION -->
    <script>
        const sampleStaff = [
            { name: "Victor O. Okeke", role: "Executive Director / IT Lead", id: "HRCDI/STF/2026/01" },
            { name: "Rejoice I. Obinna", role: "Program Manager", id: "HRCDI/STF/2026/02" },
            { name: "Isaac Hassan", role: "Board Trustee Advisor", id: "HRCDI/STF/2026/03" },
            { name: "Staff Member 4", role: "Field Coordinator", id: "HRCDI/STF/2026/04" },
            { name: "Staff Member 5", role: "Community Volunteer", id: "HRCDI/STF/2026/05" }
        ];

        function generateCards() {
            const countInput = document.getElementById('staff-count').value;
            const count = Math.min(Math.max(parseInt(countInput) || 1, 1), 20);
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const staff = sampleStaff[i] || { name: `Staff Member ${i+1}`, role: "Field Operative", id: `HRCDI/STF/2026/0${i+1}` };
                
                const wrapper = document.createElement('div');
                wrapper.className = 'id-card-wrapper';
                wrapper.innerHTML = `
                    <div class="text-xs text-emerald-400 font-bold self-center no-print w-full text-center pb-2">Staff Profile #${i+1}</div>
                    
                    <!-- FRONT SIDE -->
                    <div class="id-card border border-slate-200">
                        <div class="bg-[#022c22] text-white pt-3 pb-2 px-3 text-center relative border-b-4 border-emerald-500">
                            <div class="w-8 h-1 bg-slate-400 rounded-full mx-auto mb-1.5 opacity-50"></div>
                            <div class="flex items-center justify-center gap-2">
                                <img src="IMG_2369.png" alt="Logo" class="h-7 w-auto object-contain sharp-logo">
                                <div class="text-left">
                                    <h3 class="text-[9px] font-extrabold uppercase tracking-tight leading-none text-emerald-300">HRCDI</h3>
                                    <p class="text-[7px] text-slate-300">Community Development Initiative</p>
                                </div>
                            </div>
                        </div>

                        <div class="px-5 py-3 text-center flex-grow flex flex-col items-center justify-center space-y-2.5">
                            <div class="w-24 h-24 rounded-2xl bg-slate-200 border-4 border-emerald-700/20 overflow-hidden shadow-inner flex items-center justify-center text-slate-400 relative">
                                <i id="photo-icon-${i}" class="fa-solid fa-user text-4xl"></i>
                                <img id="preview-img-${i}" src="" alt="Staff Photo" class="w-full h-full object-cover hidden">
                                <input type="file" id="file-${i}" accept="image/*" class="hidden" onchange="loadStaffPhoto(event, ${i})">
                                <label for="file-${i}" class="absolute inset-0 bg-black/40 text-white text-[10px] font-bold flex items-center justify-center opacity-0 hover:opacity-100 transition cursor-pointer">
                                    <i class="fa-solid fa-camera mr-1"></i> Upload
                                </label>
                            </div>

                            <div class="space-y-0.5 w-full" contenteditable="true">
                                <h2 class="font-extrabold text-slate-900 text-base tracking-tight">${staff.name}</h2>
                                <p class="text-[11px] font-bold text-emerald-700 uppercase tracking-wider">${staff.role}</p>
                            </div>

                            <div class="w-full bg-slate-50 py-1.5 px-3 rounded-xl border border-slate-200 text-left flex justify-between items-center text-[11px]" contenteditable="true">
                                <div>
                                    <span class="text-[8px] text-slate-400 block font-bold uppercase">Staff ID No:</span>
                                    <span class="font-mono font-bold text-slate-800">${staff.id}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-[8px] text-slate-400 block font-bold uppercase">Status:</span>
                                    <span class="text-emerald-700 font-extrabold text-[10px]">VERIFIED</span>
                                </div>
                            </div>
                        </div>

                        <div class="bg-slate-100 py-2.5 px-3 border-t border-slate-200 flex items-center justify-between">
                            <div class="text-left">
                                <p class="text-[7px] text-slate-500 font-bold uppercase">Borno State, Nigeria</p>
                                <p class="text-[7px] text-emerald-800 font-semibold">www.hrcdi.org.ng</p>
                            </div>
                            <div class="w-8 h-8 bg-white border border-slate-300 p-0.5 rounded flex items-center justify-center text-slate-800">
                                <i class="fa-solid fa-qrcode text-base"></i>
                            </div>
                        </div>
                    </div>

                    <!-- BACK SIDE -->
                    <div class="id-card border border-slate-200 bg-slate-50" contenteditable="true">
                        <div class="bg-slate-900 text-white py-2.5 px-3 text-center">
                            <h4 class="text-[11px] font-bold uppercase tracking-wider text-emerald-400">Official Staff Credential</h4>
                            <p class="text-[8px] text-slate-300">Hope Rising Community Development Initiative</p>
                        </div>

                        <div class="p-5 space-y-3 text-[10px] text-slate-700 leading-relaxed">
                            <div>
                                <h5 class="font-bold text-slate-900 uppercase text-[9px] text-emerald-800">Terms & Conditions</h5>
                                <p class="text-[9px] text-slate-600 mt-0.5">This card remains the property of HRCDI. If found, please return to the nearest police station or mail to our official address.</p>
                            </div>

                            <div class="space-y-1 bg-white p-2.5 rounded-xl border border-slate-200">
                                <h5 class="font-bold text-slate-900 uppercase text-[9px]">Emergency Contact</h5>
                                <p class="text-slate-600"><strong>Tel:</strong> 09030700643</p>
                                <p class="text-slate-600"><strong>Email:</strong> info@hrcdi.org.ng</p>
                                <p class="text-slate-600"><strong>Base:</strong> Maiduguri, Borno State, Nigeria</p>
                            </div>

                            <div class="text-center pt-1">
                                <p class="text-[8px] text-slate-400 italic">"Promoting rural livelihoods, education, healthcare & grassroots empowerment."</p>
                            </div>
                        </div>

                        <div class="bg-white py-2.5 px-5 border-t border-slate-200 flex justify-between items-center">
                            <div>
                                <div class="w-20 border-b border-slate-400 mb-0.5"></div>
                                <span class="text-[8px] font-bold text-slate-500 uppercase">Authorized Signature</span>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-emerald-50 border border-emerald-200 flex items-center justify-center text-emerald-800 text-[10px] font-bold">
                                SEAL
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            }
        }

        function loadStaffPhoto(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById(`preview-img-${index}`);
                    const icon = document.getElementById(`photo-icon-${index}`);
                    
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    icon.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        // Generate 1 card by default on load
        window.onload = function() {
            generateCards();
        }
    </script>

</body>
</html>
