<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRCDI — Staff Portal & Field Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 md:p-8">

    <!-- NIN AUTHENTICATION GATEWAY -->
    <div id="auth-box" class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
        <div class="text-center space-y-1">
            <h1 class="text-lg font-bold text-white flex items-center justify-center gap-2">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i> HRCDI Staff Portal
            </h1>
            <p class="text-xs text-slate-400">Hope Rising Community Development Initiative</p>
        </div>

        <form id="nin-auth-form" onsubmit="verifyStaffNIN(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Enter Your 11-Digit NIN</label>
                <input type="text" id="staff-nin" maxlength="11" required placeholder="e.g. 12345678901" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white font-mono text-center tracking-widest focus:outline-none focus:border-emerald-500 text-sm">
            </div>
            <button type="submit" id="auth-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs transition-colors">
                Verify Credentials & Access Portal
            </button>
        </form>

        <div id="auth-status-message" class="hidden text-center text-xs p-3 rounded-xl border"></div>
    </div>

    <!-- VIEW 1: FIELD OFFICER / VOLUNTEER REPORTING FORM -->
    <div id="field-portal-view" class="hidden max-w-lg w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <div>
                <h2 id="field-staff-name" class="text-sm font-bold text-white"></h2>
                <p id="field-staff-role" class="text-[11px] text-emerald-400 font-medium"></p>
            </div>
            <button onclick="logoutStaff()" class="text-xs text-slate-400 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i> Exit</button>
        </div>

        <form id="field-report-form" onsubmit="submitFieldReport(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-400 font-semibold mb-1">Report Category</label>
                <select id="report-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white">
                    <option value="Daily Field Activity">Daily Field Activity Log</option>
                    <option value="Resource Distribution">Community Resource Distribution</option>
                    <option value="Incident Report">Field Incident Report</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-400 font-semibold mb-1">Activity / Assessment Summary</label>
                <textarea id="report-details" required rows="4" placeholder="Describe field operations, community engagement, or observations..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white"></textarea>
            </div>

            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between text-slate-400">
                <span class="flex items-center gap-2"><i class="fa-solid fa-location-crosshairs text-emerald-400"></i> GPS Geolocation Status:</span>
                <span id="gps-status" class="text-amber-400 font-mono text-[11px]">Acquiring coordinates...</span>
            </div>

            <button type="submit" id="submit-report-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-colors">
                Submit Geolocated Field Record
            </button>
        </form>
    </div>

    <!-- VIEW 2: MANAGEMENT & EXECUTIVE OVERSIGHT DASHBOARD -->
    <div id="management-portal-view" class="hidden max-w-4xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <div>
                <h2 id="mgmt-staff-name" class="text-sm font-bold text-white"></h2>
                <p id="mgmt-staff-role" class="text-[11px] text-emerald-400 font-medium"></p>
            </div>
            <div class="space-x-3">
                <button onclick="loadAllReports()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-xl">Refresh Logs</button>
                <button onclick="logoutStaff()" class="text-xs text-slate-400 hover:text-red-400"><i class="fa-solid fa-right-from-bracket"></i> Exit</button>
            </div>
        </div>

        <div class="space-y-3">
            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Submitted Field Reports & Activity Logs</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-[10px]">
                        <tr>
                            <th class="p-3">Staff Member</th>
                            <th class="p-3">Role</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Details</th>
                            <th class="p-3">GPS / Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="reports-table-body" class="divide-y divide-slate-800">
                        <tr><td colspan="5" class="p-4 text-center text-slate-500">Loading reports...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://hrcdi.org.ng';
        let loggedInStaffNIN = '';
        let currentLat = '';
        let currentLng = '';

        function verifyStaffNIN(e) {
            e.preventDefault();
            const nin = document.getElementById('staff-nin').value;
            loggedInStaffNIN = nin;
            const msgBox = document.getElementById('auth-status-message');
            const btn = document.getElementById('auth-btn');

            btn.disabled = true;
            btn.innerText = "Authenticating NIN...";

            const formData = new FormData();
            formData.append('nin', nin);

            fetch(`${API_BASE}/staff-auth.php`, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(res => {
                    btn.disabled = false;
                    btn.innerText = "Verify Credentials & Access Portal";
                    msgBox.className = 'hidden text-center text-xs p-3 rounded-xl border';

                    if (res.status === 'success') {
                        document.getElementById('auth-box').classList.add('hidden');
                        const staff = res.data;
                        const executiveRoles = [
                            'Board of Trustees (BoT)', 
                            'Executive Director', 
                            'Deputy Executive Director', 
                            'Programme Manager', 
                            'Project Manager', 
                            'Project Coordinator'
                        ];

                        if (executiveRoles.includes(staff.role)) {
                            // Show Management & Oversight View
                            document.getElementById('management-portal-view').classList.remove('hidden');
                            document.getElementById('mgmt-staff-name').innerText = staff.full_name;
                            document.getElementById('mgmt-staff-role').innerText = staff.role + ' (Executive Access)';
                            loadAllReports();
                        } else {
                            // Show Field Operations View
                            document.getElementById('field-portal-view').classList.remove('hidden');
                            document.getElementById('field-staff-name').innerText = staff.full_name;
                            document.getElementById('field-staff-role').innerText = staff.role + ' (Field Access)';
                            initGeolocation();
                        }
                    } else {
                        msgBox.className = 'text-center text-xs p-3 rounded-xl border bg-red-950 text-red-400 border-red-800';
                        msgBox.innerText = res.message;
                    }
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.innerText = "Verify Credentials & Access Portal";
                    alert("Unable to reach backend server.");
                });
        }

        function initGeolocation() {
            const gpsStatus = document.getElementById('gps-status');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        currentLat = position.coords.latitude.toFixed(6);
                        currentLng = position.coords.longitude.toFixed(6);
                        gpsStatus.innerText = `${currentLat}, ${currentLng}`;
                        gpsStatus.className = "text-emerald-400 font-mono text-[11px]";
                    },
                    () => {
                        gpsStatus.innerText = "GPS Disabled / Unavailable";
                        gpsStatus.className = "text-red-400 font-mono text-[11px]";
                    },
                    { timeout: 10000 }
                );
            } else {
                gpsStatus.innerText = "Not supported by browser";
            }
        }

        function submitFieldReport(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-report-btn');
            btn.disabled = true;

            const formData = new FormData();
            formData.append('action', 'submit');
            formData.append('nin', loggedInStaffNIN);
            formData.append('report_type', document.getElementById('report-type').value);
            formData.append('report_details', document.getElementById('report-details').value);
            formData.append('latitude', currentLat);
            formData.append('longitude', currentLng);

            fetch(`${API_BASE}/submit-report.php`, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(res => {
                    btn.disabled = false;
                    alert(res.message);
                    if (res.status === 'success') {
                        document.getElementById('field-report-form').reset();
                    }
                });
        }

        function loadAllReports() {
            fetch(`${API_BASE}/submit-report.php?action=list`)
                .then(res => res.json())
                .then(res => {
                    const tbody = document.getElementById('reports-table-body');
                    tbody.innerHTML = '';

                    if (res.status === 'success' && res.data.length > 0) {
                        res.data.forEach(rep => {
                            const gpsText = rep.latitude ? `${rep.latitude}, ${rep.longitude}` : 'No GPS';
                            tbody.innerHTML += `
                                <tr class="hover:bg-slate-950/50 align-top">
                                    <td class="p-3 font-semibold text-white">${rep.full_name}</td>
                                    <td class="p-3 text-emerald-400">${rep.role}</td>
                                    <td class="p-3">${rep.report_type}</td>
                                    <td class="p-3 max-w-xs break-words text-slate-300">${rep.report_details}</td>
                                    <td class="p-3 font-mono text-[10px] text-slate-400">
                                        <div><i class="fa-solid fa-location-dot text-emerald-400 mr-1"></i>${gpsText}</div>
                                        <div class="mt-1"><i class="fa-solid fa-clock text-slate-500 mr-1"></i>${rep.created_at}</div>
                                    </td>
                                </tr>
                            `;
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No field reports submitted yet.</td></tr>`;
                    }
                });
        }

        function logoutStaff() {
            location.reload();
        }
    </script>
</body>
</html>
