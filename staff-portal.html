<!-- Updated Script Logic for Mobile Safari & iOS -->
    <script>
        const STAFF_PIN = "HRCDI2026";

        function authenticateStaff(e) {
            e.preventDefault();
            const inputPin = document.getElementById('staff-pin').value.trim();
            const errorMsg = document.getElementById('error-msg');

            if (inputPin === STAFF_PIN) {
                sessionStorage.setItem('hrcdi_staff_authed', 'true');
                document.getElementById('login-card').classList.add('hidden');
                document.getElementById('location-modal').classList.remove('hidden');
                document.getElementById('location-modal').classList.add('flex');
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        function requestLocation() {
            const statusText = document.getElementById('geo-status');
            statusText.innerText = "Requesting GPS coordinates...";
            statusText.className = "text-[11px] text-emerald-400 mt-2 animate-pulse";

            if (!("geolocation" in navigator)) {
                statusText.innerText = "Geolocation is not supported by your browser.";
                statusText.className = "text-[11px] text-red-400 mt-2 font-medium";
                return;
            }

            // Fallback options optimized for iOS Safari
            const options = {
                enableHighAccuracy: false, // Set false to ensure fast response on mobile cellular networks
                timeout: 15000,
                maximumAge: 60000
            };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(4);
                    const lng = position.coords.longitude.toFixed(4);
                    
                    sessionStorage.setItem('hrcdi_lat', lat);
                    sessionStorage.setItem('hrcdi_lng', lng);

                    openDashboard(lat, lng);
                },
                (error) => {
                    if (error.code === error.PERMISSION_DENIED) {
                        statusText.innerText = "Location access denied. Please enable location permissions in Safari settings.";
                    } else {
                        // If GPS accuracy times out, record coarse position or prompt user
                        statusText.innerText = "Unable to lock GPS. Please tap 'Accept & Share Location' again.";
                    }
                    statusText.className = "text-[11px] text-red-400 mt-2 font-medium";
                },
                options
            );
        }

        function openDashboard(lat, lng) {
            document.getElementById('coords-text').innerText = `Latitude: ${lat} | Longitude: ${lng}`;
            document.getElementById('location-modal').classList.add('hidden');
            document.getElementById('location-modal').classList.remove('flex');
            document.getElementById('staff-content').classList.remove('hidden');
        }

        function logoutStaff() {
            sessionStorage.removeItem('hrcdi_staff_authed');
            sessionStorage.removeItem('hrcdi_lat');
            sessionStorage.removeItem('hrcdi_lng');
            location.reload();
        }

        // Restore session if already verified in current browser session
        if (sessionStorage.getItem('hrcdi_staff_authed') === 'true' && sessionStorage.getItem('hrcdi_lat')) {
            document.getElementById('login-card').classList.add('hidden');
            openDashboard(sessionStorage.getItem('hrcdi_lat'), sessionStorage.getItem('hrcdi_lng'));
        }
    </script>
