<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRCDI Premium Organizational ID Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            min-height: 100vh;
        }
        .id-card-wrapper {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* CR80 ID Card with Professional Metallic & Logo Glow */
        .id-card {
            width: 340px;
            height: 520px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 20px 35px -10px rgba(0, 255, 128, 0.15), 0 10px 20px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 2px solid #059669;
        }
        /* Subtle lighting reflection across the card */
        .id-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 45%, rgba(255,255,255,0.1) 50%, transparent 55%);
            pointer-events: none;
        }
        .sharp-logo {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        @media print {
            body {
                background: white !important;
            }
            .no-print {
                display: none !important;
            }
            .id-card-wrapper {
                background: transparent;
                border: none;
                padding: 0;
                margin: 0 auto;
                page-break-inside: avoid;
                break-inside: avoid;
                display: flex;
                flex-direction: row;
                gap: 15px;
                justify-content: center;
                align-items: center;
                page-break-after: always;
            }
            .id-card {
                box-shadow: none;
                border: 2px solid #047857;
                margin: 0;
                page-break-inside: avoid;
                break-inside: avoid;
            }
        }
    </style>
</head>
<body class="p-4 sm:p-8 flex flex-col items-center min-h-screen">

    <!-- CONTROL PANEL (NO PRINT) -->
    <div class="max-w-xl w-full mb-8 no-print text-white bg-slate-900/90 backdrop-blur p-5 rounded-2xl border border-emerald-500/30 shadow-2xl flex flex-col sm:flex-row justify-between items-center gap-4">
        <div>
            <h2 class="font-bold text-base text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-id-card-clip text-emerald-400"></i> HRCDI ID Generator
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">Select how many staff cards to generate (Up to 30):</p>
        </div>
        <div class="flex items-center gap-2">
            <input type="number" id="staff-count" min="1" max="30" value="2" class="w-16 px-3 py-2 bg-slate-950 border border-emerald-500/40 rounded-xl text-white font-bold text-center text-sm focus:outline-none focus:border-emerald-400">
            <button onclick="generateCards()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-emerald-900/30 flex items-center gap-1.5 whitespace-nowrap">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate
            </button>
            <button onclick="window.print()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl transition shadow flex items-center gap-1.5 whitespace-nowrap border border-slate-700">
                <i class="fa-solid fa-print"></i> Print Cards
            </button>
        </div>
    </div>

    <!-- DYNAMIC CARDS CONTAINER -->
    <div id="cards-container" class="w-full max-w-6xl space-y-8">
        <!-- Cards generated dynamically -->
    </div>

    <script>
        const sampleStaff = [
            { name: "Victor O. Okeke", role: "Executive Director / IT Lead", id: "HRCDI/STF/2026/01" },
            { name: "Rejoice I. Obinna", role: "Program Manager", id: "HRCDI/STF/2026/02" },
            { name: "Isaac Hassan", role: "Board Trustee Advisor", id: "HRCDI/STF/2026/03" },
            { name: "Aisha Mohammed", role: "Field Coordinator", id: "HRCDI/STF/2026/04" },
            { name: "Ibrahim Sani", role: "Community Outreach Officer", id: "HRCDI/STF/2026/05" },
            { name: "Grace Chukwu", role: "Administrative Secretary", id: "HRCDI/STF/2026/06" },
            { name: "Usman Danladi", role: "Logistics & Transport Officer", id: "HRCDI/STF/2026/07" },
            { name: "Fatima Bello", role: "Health & Sanitation Lead", id: "HRCDI/STF/2026/08" }
        ];

        function generateCards() {
            const countInput = document.getElementById('staff-count').value;
            const count = Math.min(Math.max(parseInt(countInput) || 1, 1), 30);
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const staff = sampleStaff[i] || { 
                    name: `Staff Member ${i+1}`, 
                    role: "Field Operative", 
                    id: `HRCDI/STF/2026/${(i+1).toString().padStart(2, '0')}` 
                };
                
                const wrapper = document.createElement('div');
                wrapper.className = 'id-card-wrapper';
                wrapper.innerHTML = `
                    <div class="text-xs text-emerald-400 font-bold self-center no-print w-full text-center pb-1">Staff Credential Set #${i+1}</div>
                    
                    <!-- ================= FRONT SIDE ================= -->
                    <div class="id-card">
                        <!-- RADIANT ORGANIZATION HEADER -->
                        <div class="bg-gradient-to-r from-slate-950 via-emerald-950 to-slate-950 text-white pt-3.5 pb-3 px-4 relative border-b-4 border-emerald-500 shadow-md">
                            <div class="w-10 h-1 bg-emerald-500/50 rounded-full mx-auto mb-2"></div>
                            <div class="flex items-center gap-3">
                                <div class="bg-white p-1 rounded-lg shadow-md border border-emerald-400/40">
                                    <img src="IMG_2369.png" alt="Logo" class="h-8 w-auto object-contain sharp-logo">
                                </div>
                                <div>
                                    <h3 class="text-[10.5px] font-extrabold uppercase tracking-widest text-emerald-300 leading-tight">HRCDI</h3>
                                    <p class="text-[7.5px] text-slate-300 leading-none mt-0.5 font-semibold">Community Development Initiative</p>
                                </div>
                            </div>
                        </div>

                        <!-- ID BODY SECTION -->
                        <div class="px-5 py-3 text-center flex-grow flex flex-col items-center justify-between">
                            
                            <!-- PASSPORT PHOTO UPLOAD CONTAINER -->
                            <div class="w-24 h-24 rounded-2xl bg-slate-100 border-2 border-emerald-500/40 overflow-hidden shadow-inner flex items-center justify-center text-slate-400 relative mt-1 ring-4 ring-emerald-500/10">
                                <i id="photo-icon-${i}" class="fa-solid fa-user text-3xl text-emerald-700/50"></i>
                                <img id="preview-img-${i}" src="" alt="Staff Photo" class="w-full h-full object-cover hidden">
                                <input type="file" id="file-${i}" accept="image/*" class="hidden" onchange="loadStaffPhoto(event, ${i})">
                                <label for="file-${i}" class="absolute inset-0 bg-slate-950/60 text-white text-[9px] font-bold flex items-center justify-center opacity-0 hover:opacity-100 transition cursor-pointer backdrop-blur-xs">
                                    <i class="fa-solid fa-camera mr-1 text-emerald-400"></i> Upload Photo
                                </label>
                            </div>

                            <!-- NAME & TITLE (Editable) -->
                            <div class="space-y-0.5 w-full my-1" contenteditable="true">
                                <h2 class="font-extrabold text-slate-900 text-base tracking-tight">${staff.name}</h2>
                                <p class="text-[11px] font-bold text-emerald-700 uppercase tracking-wide">${staff.role}</p>
                            </div>

                            <!-- IDENTIFICATION META (Editable) -->
                            <div class="w-full bg-emerald-50/60 py-2 px-3 rounded-xl border border-emerald-200 text-left flex justify-between items-center text-[11px] mb-1 shadow-xs" contenteditable="true">
                                <div>
                                    <span class="text-[7.5px] text-emerald-800 block font-bold uppercase">Staff ID No:</span>
                                    <span class="font-mono font-bold text-slate-900">${staff.id}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-[7.5px] text-emerald-800 block font-bold uppercase">Authorization:</span>
                                    <span class="text-emerald-700 font-extrabold text-[9.5px]">VERIFIED</span>
                                </div>
                            </div>

                        </div>

                        <!-- CARD FOOTER BAR -->
                        <div class="bg-slate-900 text-white py-2.5 px-4 border-t-2 border-emerald-500 flex items-center justify-between">
                            <div class="text-left">
                                <p class="text-[7.5px] text-emerald-400 font-bold uppercase tracking-wider">Borno State, Nigeria</p>
                                <p class="text-[7.5px] text-slate-300 font-medium">www.hrcdi.org.ng</p>
                            </div>
                            <div class="w-8 h-8 bg-white border border-emerald-400 p-0.5 rounded-lg flex items-center justify-center text-slate-900 shadow-sm">
                                <i class="fa-solid fa-qrcode text-sm text-emerald-800"></i>
                            </div>
                        </div>
                    </div>

                    <!-- ================= BACK SIDE ================= -->
                    <div class="id-card bg-slate-50/90" contenteditable="true">
                        <!-- BACK HEADER -->
                        <div class="bg-gradient-to-r from-emerald-950 via-slate-950 to-emerald-950 text-white py-3 px-4 text-center border-b-2 border-emerald-500">
                            <h4 class="text-[10px] font-bold uppercase tracking-widest text-emerald-300">Official Credential</h4>
                            <p class="text-[7.5px] text-slate-300">Hope Rising Community Development Initiative</p>
                        </div>

                        <!-- TERMS & EMERGENCY CONTACT -->
                        <div class="p-4 space-y-2.5 text-[9.5px] text-slate-700 leading-relaxed">
                            <div class="bg-white p-2.5 rounded-xl border border-emerald-100 shadow-2xs">
                                <h5 class="font-bold text-slate-900 uppercase text-[8.5px] text-emerald-800 mb-0.5">Terms of Use</h5>
                                <p class="text-[8.5px] text-slate-600 leading-tight">This identification card is the property of HRCDI. If found, please return to the nearest police station or our headquarters in Maiduguri.</p>
                            </div>

                            <div class="bg-white p-2.5 rounded-xl border border-emerald-100 shadow-2xs space-y-0.5">
                                <h5 class="font-bold text-slate-900 uppercase text-[8.5px] text-emerald-800">Contact Support</h5>
                                <p class="text-[8.5px] text-slate-600"><strong>Tel:</strong> 09030700643</p>
                                <p class="text-[8.5px] text-slate-600"><strong>Email:</strong> info@hrcdi.org.ng</p>
                                <p class="text-[8.5px] text-slate-600"><strong>Base:</strong> Borno State, Nigeria</p>
                            </div>

                            <div class="text-center pt-0.5">
                                <p class="text-[8px] text-emerald-800 font-semibold italic">"Grassroots Empowerment & Sustainable Development"</p>
                            </div>
                        </div>

                        <!-- SIGNATURE & SEAL STRIP -->
                        <div class="bg-slate-900 text-white py-2.5 px-4 border-t border-emerald-500/40 flex justify-between items-center mt-auto">
                            <div>
                                <div class="w-20 border-b border-slate-500 mb-0.5"></div>
                                <span class="text-[7.5px] font-bold text-slate-400 uppercase">Authorized Signature</span>
                            </div>
                            <div class="w-9 h-9 rounded-full bg-emerald-600 border border-emerald-400 flex items-center justify-center text-white text-[9px] font-extrabold shadow-md tracking-wider">
                                SEAL
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(wrapper);
            }
        }

        function loadStaffPhoto(event, index) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById(`preview-img-${index}`);
                    const icon = document.getElementById(`photo-icon-${index}`);
                    
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    icon.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        window.onload = function() {
            generateCards();
        }
    </script>

</body>
</html>
